name: Security portfolio QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check site-shell.js
          node --check bg-field.js
          node --check motion.js
          node --check case-study.mjs
          node --check workbench.mjs
          node --check engines.mjs
          node --check project-data.mjs
          node --check scripts/check-site.mjs
          node --check scripts/build-cases.mjs
          node --check scripts/build-site.mjs
          python3 -m py_compile scripts/devserver.py
      - name: Generate static SEO cases and validate production output
        run: node scripts/build-site.mjs
      - name: Deterministic engine tests
        run: node --test tests/engines.test.mjs
      - name: Install browser QA dependency
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npx playwright test
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akshay-sec-visual-review
          path: |
            test-results/visual
            test-results/visual-audit
          if-no-files-found: ignore
          retention-days: 7
      - name: Package verified static site
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          (cd dist && zip -q -r ../akshay-sec-release.zip .)
          unzip -t akshay-sec-release.zip
      - name: Upload deployment-ready release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: akshay-sec-deployable-site
          path: akshay-sec-release.zip
          retention-days: 14
