name: Portfolio quality checks

on:
  push:
    branches: [main, portfolio-final-quality-pass-2026-11-14]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check bg-field.js
          node --check scripts/check-site.mjs
      - name: Site links and assets
        run: node scripts/check-site.mjs
